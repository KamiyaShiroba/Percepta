[package]
name = "percepta"
version = "1.0.0-alpha"
edition = "2021"
description = "Colour picker for Clip Studio Paint, connected over Companion Mode"

[dependencies]
eframe = "0.37"
lcms2 = "6"
rand = "0.8"
raw-window-handle = "0.6"
resvg = { version = "0.49", default-features = false }
rqrr = "0.11"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
xcap = "0.9"

# Redrawing the wheel's square computes a colour per pixel on every hue change.
[profile.dev]
opt-level = 1

# Screen capture and QR decoding are too slow unoptimised, even in dev builds.
[profile.dev.package."*"]
opt-level = 2
